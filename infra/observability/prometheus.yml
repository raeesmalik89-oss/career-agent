# Scrapes the Career Agent API. /metrics needs METRICS_TOKEN when scraped from another container/host;
# put the same value in infra/observability/metrics_token (git-ignored) before `docker compose --profile observability up`.
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: career-agent
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
