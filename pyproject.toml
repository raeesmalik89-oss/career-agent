[project]
name = "career-agent"
version = "1.0.1"
description = "Agentic job search, application, skill-gap and interview-prep platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "pyotp>=2.9",
    "cryptography>=42",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "fpdf2>=2.8.8",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires a real PostgreSQL (set TEST_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"backend/migrations/**" = ["E501"]

[tool.coverage.run]
source = ["backend/app", "agents", "scheduler", "integrations"]
omit = ["backend/migrations/*"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
