# Career Agent: PostgreSQL + API + scheduler + dashboard, all bound to 127.0.0.1.
#   docker compose up -d --build                        -> http://localhost:3000
#   docker compose --profile observability up -d       -> + Prometheus :9090, Grafana :3001
# For a server with HTTPS add the production override:  see docs/DEPLOYMENT.md
name: career-agent

x-app: &app
  build: .
  image: career-agent-api:${APP_VERSION:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-career_agent}
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [backend]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  api:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    # Same image as the API; runs the daily pipelines. Starts after the API, which applies the migrations.
    <<: *app
    command: ["python", "-m", "scheduler"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    image: career-agent-web:${APP_VERSION:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend]
    restart: unless-stopped

  # ---- optional: docker compose --profile observability up -d ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/observability/metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api]
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      # admin password from a git-ignored file (see docs/DEPLOYMENT.md); never a default
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [backend]
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:

networks:
  backend:
